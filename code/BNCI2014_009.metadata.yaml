methodology: Ten healthy subjects (10 female, mean age = 26.8 ± 5.6) with previous experience with P300-based BCIs attended
  4 recording sessions. Scalp EEG potentials were measured using 16 Ag/AgCl electrodes arranged on an elastic cap per the
  10-10 standard. Each electrode was referenced to the linked earlobes and grounded to the right mastoid. The EEG was acquired
  using a g.USBamp amplifier (g.Tec, Austria), digitized at 256 Hz, high pass- and low pass-filtered with cutoff frequencies
  of 0.1 Hz and 20 Hz, respectively. The electrode impedance did not exceed 10 kΩ. Visual stimulation, acquisition and online
  classification were performed with BCI2000. Each subject attended 4 recording sessions. During each session, the subject
  performed three runs with each of the stimulation interfaces. Each trial consisted of eight stimulation sequences, and thus,
  16 intensifications of the target character. Each stimulus was intensified for 125 ms, with an inter stimulus interval (ISI)
  of 125 ms, yielding a 250 ms lag between the appearance of two stimuli (SOA). Pseudorandom stimulation sequences were assembled
  so that each target intensification would not occur within 500 ms after the previous one to avoid the attentional blink
  phenomenon.
