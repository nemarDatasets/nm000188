abstract: 'This dataset represents a complete record of P300 evoked potentials recorded with BCI2000 using two different paradigms:
  a paradigm based on the P300 Speller originally described by Farwell and Donchin in overt attention condition and a paradigm
  based on the GeoSpell interface used in covert attention condition. In these sessions, 10 healthy subjects focused on one
  out of 36 different characters. The objective was to predict the correct character in each of the provided character selection
  epochs.'
